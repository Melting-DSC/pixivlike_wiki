<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="title desc">
  <title id="title">ポインタのイメージ図</title>
  <desc id="desc">変数xの値42と、そのアドレスを指すポインタpの関係を表した図です。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#edf6ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#2f7fbf"/>
    </marker>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#123f6b" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="800" height="320" rx="18" fill="url(#bg)" stroke="#cfe4f6" stroke-width="2"/>
  <path d="M0 64h800" stroke="#dcecf9" stroke-width="2"/>
  <text x="28" y="40" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="17" font-weight="700" fill="#123f6b">ポインタの気持ち</text>
  <text x="772" y="39" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" fill="#5b7c99">memory_map.txt</text>

  <!-- variable card -->
  <g filter="url(#cardShadow)">
    <rect x="42" y="102" width="190" height="152" rx="12" fill="#ffffff" stroke="#d6e7f5" stroke-width="2"/>
  </g>
  <rect x="42" y="102" width="190" height="34" rx="12" fill="#eaf4fd"/>
  <rect x="42" y="124" width="190" height="12" fill="#eaf4fd"/>
  <text x="60" y="125" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14" font-weight="700" fill="#2f7fbf">変数 x</text>
  <text x="60" y="166" font-family="ui-monospace, monospace" font-size="13" fill="#5b7c99">int x = 42;</text>
  <rect x="60" y="182" width="154" height="48" rx="8" fill="#f7fbff" stroke="#cfe4f6"/>
  <text x="137" y="213" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#123f6b">42</text>

  <!-- pointer card -->
  <g filter="url(#cardShadow)">
    <rect x="304" y="102" width="220" height="152" rx="12" fill="#ffffff" stroke="#d6e7f5" stroke-width="2"/>
  </g>
  <rect x="304" y="102" width="220" height="34" rx="12" fill="#eaf4fd"/>
  <rect x="304" y="124" width="220" height="12" fill="#eaf4fd"/>
  <text x="322" y="125" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14" font-weight="700" fill="#2f7fbf">ポインタ p</text>
  <text x="322" y="166" font-family="ui-monospace, monospace" font-size="13" fill="#5b7c99">int *p = &amp;x;</text>
  <rect x="322" y="182" width="184" height="48" rx="8" fill="#f7fbff" stroke="#cfe4f6"/>
  <text x="414" y="212" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#123f6b">0x7ffc·1a2b</text>

  <!-- memory card -->
  <g filter="url(#cardShadow)">
    <rect x="596" y="102" width="162" height="152" rx="12" fill="#123f6b" stroke="#123f6b" stroke-width="2"/>
  </g>
  <text x="614" y="131" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14" font-weight="700" fill="#bfe1ff">メモリの中身</text>
  <text x="614" y="164" font-family="ui-monospace, monospace" font-size="11" fill="#8ec7f0">0x7ffc·1a2b</text>
  <rect x="614" y="182" width="126" height="48" rx="8" fill="#1c5c92" stroke="#4f96c9"/>
  <text x="677" y="213" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#ffffff">42</text>

  <!-- arrows -->
  <path d="M450 206h134" stroke="#2f7fbf" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <path d="M232 206h60" stroke="#2f7fbf" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="495" y="196" text-anchor="middle" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="11" fill="#2f7fbf">アドレスをたどる</text>

  <text x="42" y="291" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="12" fill="#5b7c99">※ 図はイメージです。実際のアドレスは環境によって異なります。</text>
  <text x="758" y="291" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" fill="#5b7c99">*p == 42</text>
</svg>
